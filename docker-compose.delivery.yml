services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rental_room_system
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./rental_room_system.sql:/docker-entrypoint-initdb.d/01-rental-room-system.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
    image: rental-system-backend:1.0
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://database:3306/rental_room_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: "false"
      SESSION_COOKIE_SAME_SITE: lax
      SESSION_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: https://rental-system-frontend-ihl5.onrender.com,http://localhost:3000
      AUTHORIZATION_SERVER_ISSUER: http://localhost:8080
      RENTAL_SPA_CLIENT_ID: rental-spa
      RENTAL_SPA_REDIRECT_URIS: http://localhost:3000/callback
      FRONTEND_URL: http://localhost:3000
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    image: rental-system-frontend:1.0
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
