spring.config.import=optional:file:${user.dir}/../../.env[.properties],optional:file:${user.dir}/../.env[.properties],optional:file:${user.dir}/.env[.properties]
server.port=${SERVER_PORT:8080}
spring.application.name=rental-room-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false


spring.flyway.enabled=${FLYWAY_ENABLED:false}

server.servlet.session.cookie.name=AUTHSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=${AUTH_SESSION_TIMEOUT:30m}

authorization-server.issuer=${AUTH_SERVER_ISSUER:${AUTHORIZATION_SERVER_ISSUER:http://localhost:8080}}
authorization-server.client.id=${RENTAL_SPA_CLIENT_ID:rental-spa}
authorization-server.client.redirect-uri=${RENTAL_SPA_REDIRECT_URI:http://localhost:3000/callback}
authorization-server.jwt.private-key-path=${AUTH_SERVER_PRIVATE_KEY_PATH:}
authorization-server.jwt.public-key-path=${AUTH_SERVER_PUBLIC_KEY_PATH:}
authorization-server.jwt.key-id=${AUTH_SERVER_JWT_KEY_ID:rental-auth-key-1}

security.cors.allowed-origin=${FRONTEND_URL:${CORS_ALLOWED_ORIGIN:http://localhost:3000}}
app.frontend.login-url=${FRONTEND_LOGIN_URL:http://localhost:3000/login}


imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT}
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY}
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY}